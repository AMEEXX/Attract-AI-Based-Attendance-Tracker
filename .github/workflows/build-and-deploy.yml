name: Build Android APK & Deploy Web Portal

on:
  push:
    branches:
      - main
      - genspark_ai_developer
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attract-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.2.0-rebuild
          name: "Attract v0.2.0 — Calibrated Face ID Auto-Capture & D-007 Self-Service"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### Attract Attendance Tracker — Release v0.2.0

            This release includes the complete measured biometric rebuild plan:
            - **Calibrated Nose-Offset Yaw**: Accurate head turn calculations (`K_YAW = -60.8f`) with relative gating against straight anchor frame (`±10°–40°`).
            - **Hands-Free Auto-Capture**: Face ID / Android Face Unlock continuous capture without manual button taps per pose.
            - **BGR Tensor Preprocessing**: Switched ArcFace input tensor formatting to BGR, reducing EER from 2.11% to 1.55%.
            - **Calibrated Decision Thresholds**: `accept = 0.50`, `margin = 0.08`, `confirmBelow = 0.60`, `duplicate = 0.50`.
            - **Self-Service Enrollment (D-007)**: Students confirm their own identity from roster; teacher PIN requirement removed from student flow.
            - **Room Database v5 Migration**: Includes administrative "Reset All Face Data" failsafe in Settings.

            #### Download
            Download `app-debug.apk` below and sideload onto your Android smartphone (Android 8.0 to Android 15 supported).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web-portal:
    name: Deploy Web Portal to GitHub Pages
    needs: build-android
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

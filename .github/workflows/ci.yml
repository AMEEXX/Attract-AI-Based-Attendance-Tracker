name: Android CI & Release Hardening

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    name: Build & Verify Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses & Prepare Tools
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "Ensuring Android SDK Platform 35 is available..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Privacy Log Grep Gate
        run: |
          echo "Running privacy log grep gate (must not log names, roll numbers, scores, or embeddings)..."
          if grep -riE "Log\..*(name|roll|score|embedding)" app/src/main/java; then
            echo "ERROR: Privacy leak detected in logging! Prohibited keywords found in Log statement."
            exit 1
          fi
          echo "Privacy log grep gate passed with 0 violations."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Prepare Debug Keystore for Release Signing Fallback
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating debug keystore for CI signing fallback..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000 \
              -keyalg RSA \
              -keysize 2048
          fi

      - name: Build App Bundle (bundleRelease)
        run: |
          set -o pipefail
          ./gradlew bundleRelease --stacktrace 2>&1 | tee bundleRelease.log

      - name: Dump Bundle Failure Log
        if: failure()
        run: |
          if [ -f bundleRelease.log ]; then
            echo "===== bundleRelease.log tail ====="
            tail -n 120 bundleRelease.log
          fi

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app-release.aab
          if-no-files-found: error



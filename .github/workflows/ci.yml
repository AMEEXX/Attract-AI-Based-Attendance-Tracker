name: Android CI & Release Hardening

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    name: Build & Verify Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Privacy Log Grep Gate
        run: |
          echo "Running privacy log grep gate (must not log names, roll numbers, scores, or embeddings)..."
          if grep -riE "Log\..*(name|roll|score|embedding)" app/src/main/java; then
            echo "ERROR: Privacy leak detected in logging! Prohibited keywords found in Log statement."
            exit 1
          fi
          echo "Privacy log grep gate passed with 0 violations."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Build App Bundle (bundleRelease)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
